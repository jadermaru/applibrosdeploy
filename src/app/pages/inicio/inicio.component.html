
<button class="logout-btn" (click)="logout()">Cerrar sesión</button>
       
<div class="card-container">
    <mat-card appearance="outlined">
      <mat-card-header>
        <mat-card-title>Lista de libros</mat-card-title>
      </mat-card-header>
      <mat-card-content>
  
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Buscar</mat-label>
          <input
            matInput
            (keyup)="applyFilter($event)"
            placeholder="Título, autor o categoría">
        </mat-form-field>
  
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
  
          <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef> Nombre </th>
            <td mat-cell *matCellDef="let book"> {{book.title}} </td>
          </ng-container>
  
          <ng-container matColumnDef="author">
            <th mat-header-cell *matHeaderCellDef> Autor </th>
            <td mat-cell *matCellDef="let book"> {{book.author}} </td>
          </ng-container>
  
          <ng-container matColumnDef="category">
            <th mat-header-cell *matHeaderCellDef> Categoría </th>
            <td mat-cell *matCellDef="let book"> {{book.category.name}} </td>
          </ng-container>
  
          <ng-container matColumnDef="view">
            <th mat-header-cell *matHeaderCellDef> Ver </th>
            <td mat-cell *matCellDef="let book">
              <button  mat-raised-button color="primary" (click)="GoDetailBook(book.bookId)">
                Ver..
              </button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row        *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
  
      </mat-card-content>
    </mat-card>
  </div>
