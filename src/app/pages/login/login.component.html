<div class="card-container">
    <mat-card appearance="outlined">
        <mat-card-header>
          <mat-card-title> Iniciar Sesion</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <form class="form-custom" [formGroup]="formlogin">
            <mat-form-field class="input-custom">
              <mat-label>Usuario</mat-label>
              <input matInput formControlName="username" autocomplete="username">
            </mat-form-field>
            
            <mat-form-field class="input-custom">
              <mat-label>Contraseña</mat-label>
              <input matInput formControlName="password" type="password" autocomplete="current-password">
            </mat-form-field>
            
            
          <div class="flex">
            <form [formGroup]="formlogin" (ngSubmit)="iniciarSesion()" autocomplete="on">
              <button type="submit" mat-flat-button color="primary">Iniciar Sesion</button>
              <button type="button" mat-flat-button color="warn" (click)="registrarse()">Registrarse</button>
            </form>          
          </div>

        </form>
      </mat-card-content>
    </mat-card>
</div>
